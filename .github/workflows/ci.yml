name: OmniWM CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check against its base branch (optional)
        required: false
        type: string

permissions:
  contents: read

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  cache-dependencies:
    name: Cache dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    cache-mode: write
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            ~/.swiftly
            ~/Library/Developer/Toolchains
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'Scripts/dev-tools.env', 'Scripts/build-metadata.env', '.swift-version') }}
      - name: Install the pinned Swift toolchain
        run: ./Scripts/swift-toolchain.sh
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
  tooling:
    name: Tooling
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - name: Install Lix
        run: |
          arch="$(uname -m | sed 's/arm64/aarch64/')"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          curl -sSf -L -o /tmp/lix-installer "https://install.lix.systems/lix/lix-installer-${arch}-${os}"
          chmod +x /tmp/lix-installer
          /tmp/lix-installer install --no-confirm \
            --extra-conf "experimental-features = nix-command flakes"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Put flake tools on PATH
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          tools_out="$(nix build --no-link --print-out-paths .#default)"
          echo "${tools_out}/bin" >> "$GITHUB_PATH"
      - name: Verify formatting
        run: swiftformat --lint .
      - name: Lint
        run: swiftlint lint
      - name: Verify generated IPC wire files
        run: python3 Scripts/generate_ipc_wire.py --check
      - name: Test development tooling
        run: make test-dev-tools
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            ~/.swiftly
            ~/Library/Developer/Toolchains
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'Scripts/dev-tools.env', 'Scripts/build-metadata.env', '.swift-version') }}
      - name: Install the pinned Swift toolchain
        run: ./Scripts/swift-toolchain.sh
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Verify localization and build
        run: make localization-check
  tests:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Validate requested pull request
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/dev-tools/bin
            .cache/dev-tools/downloads
            ~/.swiftly
            ~/Library/Developer/Toolchains
            Frameworks/GhosttyKit.xcframework
          key: dev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'Scripts/dev-tools.env', 'Scripts/build-metadata.env', '.swift-version') }}
      - name: Install the pinned Swift toolchain
        run: ./Scripts/swift-toolchain.sh
      - name: Set up dependencies
        run: ./Scripts/dev-tools.sh setup
      - name: Install Lix
        run: |
          arch="$(uname -m | sed 's/arm64/aarch64/')"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          curl -sSf -L -o /tmp/lix-installer "https://install.lix.systems/lix/lix-installer-${arch}-${os}"
          chmod +x /tmp/lix-installer
          /tmp/lix-installer install --no-confirm \
            --extra-conf "experimental-features = nix-command flakes"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: Put flake tools on PATH
        env:
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          tools_out="$(nix build --no-link --print-out-paths .#default)"
          echo "${tools_out}/bin" >> "$GITHUB_PATH"
      - name: Check completion test shells
        run: |
          fish --version
          nu --version
      - name: Verify package toolchain
        run: swift package dump-package > /dev/null
      - name: Run the serial test suite
        run: LIBRARY_PATH="$(./Scripts/ghostty-preflight.sh print-library-dir)${LIBRARY_PATH:+:$LIBRARY_PATH}" swift test
